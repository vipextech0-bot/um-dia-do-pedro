<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#120a0e" />
  <title>Um Dia do Pedro</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #120a0e; overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      /* nada de scroll, zoom por gesto ou selecao de texto por cima do jogo */
      overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    /* So o Phaser centraliza o canvas (autoCenter). Centralizar tambem por
       CSS deslocava o canvas e desalinhava o mouse em janelas fora de 16:9. */
    #jogo {
      position: fixed; top: 0; bottom: 0;
      left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
    }
    /* Celular em pe: o jogo inteiro gira 90 graus e ocupa a tela toda.
       O tamanho e a posicao sao definidos em pixels pelo main.js. */
    html.retrato #jogo {
      right: auto; bottom: auto;
      transform-origin: 0 0; transform: rotate(90deg);
    }
    #jogo canvas {
      image-rendering: pixelated; image-rendering: crisp-edges;
      display: block; outline: none;
    }
    #carregando {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd66b; font-size: 12px; letter-spacing: 1px; text-align: center; padding: 24px;
      background: #120a0e; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="carregando">CARREGANDO...</div>
  <div id="jogo"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module">
    // A roda do mouse e o menu de contexto nao fazem nada por cima do jogo.
    window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    // Espera a fonte pixel carregar antes de subir o Phaser, senao o primeiro
    // frame de texto sai com a fonte de fallback e "pula" depois.
    async function iniciar() {
      try { await document.fonts.load("10px 'Press Start 2P'"); await document.fonts.ready; } catch (e) {}
      await import('./src/main.js');
      const aviso = document.getElementById('carregando');
      if (aviso) aviso.remove();
    }
    iniciar();
  </script>
</body>
</html>
